[project]
name = "pyperformance_bm_unpickle_pure_python"
requires-python = ">=3.8"
dependencies = ["pyperf@git+https://github.com/Yhg1s/pyperf@local-changes#egg=pyperf"]
urls = {repository = "https://github.com/python/pyperformance"}
dynamic = ["version"]

[tool.pyperformance]
name = "unpickle_pure_python"
tags = "serialize"
extra_opts = ["--pure-python", "unpickle"]
