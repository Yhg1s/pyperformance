[project]
name = "pyperformance_bm_thread_pipeline"
requires-python = ">=3.9"
dependencies = ["pyperf@git+https://github.com/Yhg1s/pyperf@local-changes#egg=pyperf"]
urls = {repository = "https://github.com/python/pyperformance"}
dynamic = ["version"]

[tool.pyperformance]
name = "thread_pipeline_naive"
tags = "threads"
extra_opts = ["thread_pipeline_naive"]
